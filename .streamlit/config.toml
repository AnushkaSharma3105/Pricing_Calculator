[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF6FF"
textColor = "#1B3A6B"
font = "sans serif"

[server]
maxUploadSize = 5
maxMessageSize = 50

[runner]
fastReruns = true

[client]
showErrorDetails = false
caching = true

[browser]
gatherUsageStats = false